services:
  omnisystem:
    image: node:22-alpine
    working_dir: /app
    # node --watch：原始碼變更即自動重啟（開發模式）
    command: ["node", "--watch", "server.js"]
    env_file: .env
    environment:
      # 覆寫為容器內永久卷，資料不落回原始碼目錄
      - SSAS_DATA_DIR=/data
      - HOST=0.0.0.0
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - omni_data:/data
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  omni_data: {}
